name: Rebuild datasets

# Rebuild prebuilt datasets from the official sources once a week and publish
# them to the fixed `datasets` release, so `lex` users pull ready data instead
# of scraping (see ADR-0029). Also runnable on demand.
on:
  schedule:
    - cron: "0 3 * * 0" # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: write # upload release assets

concurrency:
  group: datasets
  cancel-in-progress: false

jobs:
  ukraine:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Ukraine dataset (articles + relations)
        # -delay paces requests to be polite to the source; retries are built in.
        run: go run ./ua/scripts/import -out ua/data -articles -relations -cache "" -delay 150ms

      - name: Package
        run: tar --no-xattrs -C ua/data -czf lex-ua.tar.gz graph index.fts

      - name: Publish to the datasets release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view datasets >/dev/null 2>&1 || \
            gh release create datasets --title "Prebuilt datasets" --latest=false \
              --notes "Prebuilt lex datasets (graph + full-text index). Rebuilt weekly."
          gh release upload datasets \
            "lex-ua.tar.gz#lex-ua.tar.gz (Ukraine — articles + relations)" --clobber

  france:
